# ==============================================================================
# K1 卡 (Master 门禁卡) — 板级真源 (board truth source)
#
# 文件:     revA/boards/k1_board.yaml
# 任务:     k1-l1-bid-infra T1 — k1_board.yaml 真源构建 + 器件 refdes 对账
# 日期:     2026-08-21
# 权威:     revA/boards/k1_nets.yaml (refdes/net 权威, J14/U11/U6)
#           revA/sch_k1/*.kicad_sch (器件实例/符号/引脚数)
#           revA/pcb/export/ForgeOS.pretty/*.kicad_mod (footprint 实测 bbox)
#           AppDir KiCad 标准库 footprint (实测 bbox)
# 运行环境: 普通 python3 (无 pcbnew 依赖)
# 覆盖检查: revA/boards/k1_coverage_check.py
#
# refdes 命名: 以 k1_nets.yaml 为准 (J14=OCuLink, U11=PI3DBS16412, U6=TS3USB221A)。
#   README 概念名仅存注释: J_OCULINK=J14, U_PI3=U11, U_TPS=U12。
# 几何事实来源: geometry.source ∈ {footprint, datasheet, estimated}; 估算必带
#   estimated:true + 理由 (防逃逸预算虚高)。bbox 单位 mm, 全部来自 kicad_mod 实测。
# ==============================================================================
board:
  name: K1 (Master gate card, IOCONVERT V2.0 转换卡 1)
  card: K1
  dimension_mm:
  - 80
  - 38
  layers: 4
  card_type: Master 门禁卡 (PCIe 2.1 x2 注入 + 预鉴权)
  fixed_constraints:
  - 板框 80×38mm 4 层
  - 'J1 Type-C 卧式左缘 (horizontal, edge: left)'
  - 'J14 OCuLink 立式右缘 (vertical, edge: right)'
  - '无 ReDriver、无 AC 电容墙 (ECO31 补充说明: PCIe 2.0/2.1 5GT/s 短距直连, 不做均衡放大)'
  - K1/KEY 双公头线缆 (Mode B); Mode A 下 KEY 直插 PC, K1 不参与 (J7 已移除)
  l1_bid:
    strategy_type: mux_segmentation
    axes:
      mux_position:
      - center
      - near_j1
      - near_oculink
      power_island:
      - left
      - right
      mcu_partition:
      - independent
      - with_power
      - with_interface
  process:
    line_width_min_mm: 0.09
    spacing_min_mm: 0.1
    edge_clearance_min_mm: 0.3
    annular_ring_min_mm: 0.075
    stackup: 4 层 (F.Cu / In1 / In2 / B.Cu) — 叠层分配待 L2, 板厂确认档待定
devices:
  U1:
    value: STM32G0B1KBU6
    function: K1 MCU — 门禁鉴权 (SBU I2C Master 预鉴权) + MUX 切换 + 光耦开机 + OOB UART
    footprint: ForgeOS:MCU_STM32G0_QFN32
    sch_pins: 31
    fp_pads: 33
    geometry:
      bbox:
      - 5.9
      - 5.9
      pad_bbox:
      - 5.4
      - 5.4
      source: footprint
      provenance: revA/pcb/export/ForgeOS.pretty/MCU_STM32G0_QFN32.kicad_mod
    nets:
    - I2C1_SCL
    - I2C1_SDA
    - PERSTA#
    - PWR_BTN_OUT
    - GPIO_LED
    - UART_TX
    - UART_RX
    - P3V3_AUX
    - MCU_VDD
    - GND
    - NRST
    - SWCLK_BOOT0
    - SWDIO
    - SBU_SEL
