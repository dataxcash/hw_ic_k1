high_speed_links:
- link: PCIe Lane0 TX
  pairs:
  - PCIE_TX0_P
  - PCIE_TX0_N
  path: J1/TX_P → U9/IO3,IO4 (TVS tap) → U11/A0+,- → J14/PCIE_TX0+,-
- link: PCIe Lane0 RX
  pairs:
  - PCIE_RX0_P
  - PCIE_RX0_N
  path: J1/RX_P → U9/IO5,IO6 (TVS tap) → U11/A1+,- → J14/PCIE_RX0+,-
- link: PCIe Lane1 TX
  pairs:
  - PCIE_TX1_P
  - PCIE_TX1_N
  path: J1/TX2_P → U11/A2+,- → J14/PCIE_TX1+,-
- link: PCIe Lane1 RX
  pairs:
  - PCIE_RX1_P
  - PCIE_RX1_N
  path: J1/RX2_P → U11/A3+,- → J14/PCIE_RX1+,-
- link: HOST REFCLK direct (G4 / ECN-15)
  pairs:
  - REFCLK_P
  - REFCLK_N
  path: HOST REFCLK+/- → J14/CLOCK+/- (SlimSAS SFF-8654 A11/A12); K1 pass-through, no local clock source/ReDriver
  source: HOST
  ecn: ECN-K1-DRAFT-15-R01-standby-5v-refclk-pass.md
- notes:
  - 'MUX 分段策略 (SPEC l1_bid.strategy_type): U11 位置 = 轴一 mux_position 候选差异'
  - 'REFCLK 由 HOST 提供，经 SlimSAS J14 CLOCK± 直通 (G4 / ECN-15)；PERST#/SRIS 仍为 ECO31 Open Items 2/3 (KEY 侧)，本卡不自产时钟'
power_tree:
- rail: 12V_IN
  source: J10 (独立 DC 12V 主电源输入连接器, JST VH 10A/250V)
  consumers:
  - U8/VIN
  - U8/EN
  - C88
  notes: 独立 DC 12V 主电源输入 (需求冻结 v1 §2.6); F1 2.5A 缓断 + TVS1 SMBJ16A (③④ 落盘)
- rail: PWR_5V_MAIN
  source: L1/B (TPS54628 12V→5V 6A 同步 buck; U8/SW→L1)
  consumers:
  - U27/IN1
  - R56/A
  - R60/A
  - C89
  notes: R-17 后主 5V 只进 TPS2121 IN1 与 PR1/OV1 分压；不再直挂 U12/U24/U10
- rail: PWR_5V_SYS
  source: U27/OUT (TPS2121 双输入优先 mux, XCOMP 5us 快速切换)
  consumers:
  - U12/IN
  - U24/IN
  - U10/VIN
  - U10/EN
  - C104
  - C106
  notes: R-01/ECN-15 待命默认 5V：12V 在时主路 PWR_5V_MAIN 优先并自动切换；12V 断时由 5VSB_PROT 供电，管理/预鉴权域常活
- rail: PWR_5V_WORK
  source: U24/VOUT (TPS22990 10A 负载开关, ON=WORK_RAIL_EN)
  consumers:
  - Q1/IN
  - C98
  notes: 轨B — 工作态 3A 通路；WORK_RAIL_EN=AUTHORIZED AND POWER_LOST_N，5VSB 下硬关断；Q1/ON=WORK_EN 仍由固件控制，形成三重条件
- rail: PWR_5V_PREAUTH
  source: U12/VOUT (TPS22965 6A 负载开关, 软启动)
  consumers:
  - VBUS
  - R35/A
  - R36/A
  - C92
  notes: 轨A — S5 预鉴权轨 (OI#9); 5VSB 下仍由 PWR_5V_SYS 供电，KEY 只保有预鉴权档电
- rail: P3V3_AUX
  source: U10/VOUT (LDO 5V→3V3)
  consumers:
  - U1/3V3_AUX_SENSE
  - U6/VCC
  - U13/VCC
  - U11/VDD×6
  - R1/B
  - R30/A
  - C90
  - C91
  - U19/VCC
  - U20/VCC
  - U21/V+
  - U22/V+
  - U25/VCC
  - U26/VCC
  - U28/VCC
  - R51/A
  - R54/A
  - D5/VCC
  - C100
  - C101
  - C102
  notes: R-17 后 LDO 输入由 PWR_5V_SYS 供，5VSB 下管理/鉴权/控制域存活
- rail: MCU_VDD
  source: P3V3_AUX via R30 (0Ω bypass)
  consumers:
  - U1/VDD
  - E1/VCC
  - J9/VCC
  - J13/VCC
  - R29/B
  - R31/B
  - R32/B
  - C85
  - C86
  notes: K1 无 12V DCDC 直出 MCU 供电; R30 焊接短接 P3V3_AUX=MCU_VDD
- rail: PWR_5VSB_IN
  source: J16 (+5VSB 待机电输入, JST VH 3.96mm 3A)
  consumers:
  - F2/A
  - D6/K
  - C103
  notes: R-17 新增待机输入；F2 3A 缓断 + SMBJ5.0A TVS 输入保护；12V 不在时由本条供电
- rail: PWR_5VSB_MGMT
  source: U27/OUT (standby path from 5VSB_PROT)
  consumers:
  - U27/IN2
  - R58/A
  - R62/A
  - C103
  notes: 5VSB 支路预算 = 管理域 0.20W + 预鉴权 2.50W + mux 损耗 0.02W + 20% 余量 ≈ 3.3W；15W 工作档硬关断
