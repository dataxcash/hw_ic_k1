    ruling: 'PM 2026-08-22: J1 换 Amphenol 12401548E4-2A 24-pin full-featured Type-C (KiCad 官方库, SS 焊盘 A2/A3/A10/A11/B2/B3/B10/B11 全在) — OPEN-1 关闭'
  - id: OPEN-2
    severity: WARN
    title: U10 LDO 符号 5 pin vs SOT-23 footprint 3 pad
    evidence: sch_pins=5 (VIN/VOUT/GND/EN/NC_ADJ), footprint Package_TO_SOT_SMD:SOT-23 仅 3 pad
    impact: footprint 与符号不匹配; 实际器件应为 SOT-23-5 (实测 4.10×3.54mm)
    action: 布局预算按 SOT-23-5; 原理图 footprint 修正待 ECO
