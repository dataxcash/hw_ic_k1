    title: J1 Type-C footprint 无 SS 差分焊盘 (PCIe x2 不可实现)
    evidence: J1 符号 IOCONVERT:USB_C_RECEPT 16 pin 含 8 个 SS pin (TX_P/TX_N/RX_P/RX_N/TX2_P/TX2_N/RX2_P/RX2_N); footprint Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-12
      实测仅 16 信号 pad (A1/A4/A5/A6/A7/A8/A9/A12/B1/B4/B5/B6/B7/B8/B9/B12) + 4 SH + 2 NPTH, 无 A2/A3/A10/A11/B2/B3/B10/B11 (SS
      TX/RX)。HRO TYPE-C-31-M-12 为 16-pin USB2-only 变体。ECO31 裁定 2 (PCIe 2.1 x2) 依赖 full-featured 24-pin Type-C — 本 footprint
      不满足
    impact: PCIe x2 数据面 (J1↔U11 4 对差分) 无焊盘落点; 物理上不可路由
    action: '已裁决 (PM 2026-08-22): J1 换 Amphenol 12401548E4-2A 24-pin full-featured (SS 8/8 焊盘全在); 本 yaml 已同步 footprint/几何'
